site:
  id: default
  base_url: "http://127.0.0.1:8080/" # must end with /
  media_base_url: "http://127.0.0.1:8080/media/"
  title: "Notepub — SEO-дружелюбные сайты из Markdown без CMS"
  description: "Создавайте быстрые SEO-оптимизированные сайты и документацию из Markdown без админок и зависимостей"
  default_og_image: "/assets/notepub_og.png"
content:
  source: "local"
  local_dir: "./content/ru"
paths:
  file_root: ./.notepub-ru
  artifacts_dir: ./.notepub-ru/artifacts
  snapshot_file: ./.notepub-ru/snapshot/objects.json
  cache_root: ./.notepub-ru/cache
theme:
  dir: "."
  name: "theme"
  templates_subdir: "templates"
  assets_subdir: "assets"
rules_path: "./rules.ru.yaml"
server:
  listen: "127.0.0.1:8081"

robots:
  disallow:
    - "/private/"
  extra: |
    # Custom rules here

cache:
  html_ttl_seconds: 600
  stale_if_error_seconds: 604800

# llms.txt для языковых моделей, собирается из заметок при каждой сборке (движок v0.1.10+)
llms:
  enabled: true
  intro: "Notepub — открытый движок (MIT, один файл на Go), который собирает статический сайт из папки заметок Markdown, в том числе из хранилища Obsidian: виды страниц задаются типами заметок в rules.yaml, SEO-файлы генерируются, а `notepub audit` проверяет готовый сайт. English version: https://antonlozhkin.ru/np/llms.txt"
  sections:
    - type: home_ru
      title: Начало
    - type: hub_ru
      title: Разделы документации
    - type: article_ru
      title: Документация
    - type: page_ru
      title: Страницы
