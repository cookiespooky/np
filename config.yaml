site:
  id: default
  base_url: "http://127.0.0.1:8080/" # must end with /
  media_base_url: "http://127.0.0.1:8080/media/"
  title: "Notepub — SEO-friendly websites from Markdown without CMS"
  description: "Create fast SEO-optimized websites and documentation from Markdown without CMS and dependencies"
  default_og_image: "/assets/notepub_og.png"
content:
  source: "local"
  local_dir: "./content/en"
paths:
  file_root: ./.notepub
  artifacts_dir: ./.notepub/artifacts
  snapshot_file: ./.notepub/snapshot/objects.json
  cache_root: ./.notepub/cache
theme:
  dir: "."
  name: "theme"
  templates_subdir: "templates"
  assets_subdir: "assets"
rules_path: "./rules.yaml"
server:
  listen: "127.0.0.1:8080"

robots:
  disallow:
    - "/private/"
  extra: |
    # Custom rules here

cache:
  html_ttl_seconds: 600
  stale_if_error_seconds: 604800

# llms.txt for language models, made from the notes on every build (engine v0.1.10+)
llms:
  enabled: true
  intro: "Notepub is an open-source engine (MIT, one Go binary) that builds a static site from a folder of Markdown notes, Obsidian vaults included: page kinds come from note types in rules.yaml, SEO files are generated, and `notepub audit` checks the built site. Russian version: https://antonlozhkin.ru/np/ru/llms.txt"
  sections:
    - type: home_en
      title: Start
    - type: hub_en
      title: Documentation sections
    - type: article_en
      title: Documentation
    - type: page_en
      title: Pages
